; Пример файла настроек.
; Скопируйте этот файл в config.ini и заполните свои значения.
; Файл config.ini не добавляется в общий архив кода, потому что в нём есть пароли.

[Database]
; Адрес компьютера, на котором стоит база данных.
host = 192.168.10.220
; Порт, через который к ней подключаются.
port = 3308
user = ИМЯ_ПОЛЬЗОВАТЕЛЯ_БД
password = ПАРОЛЬ_БД
; Имя базы данных.
name = ИМЯ_БАЗЫ
charset = utf8mb4

[ActiveDirectory]
; Адрес сервера, откуда берётся список сотрудников.
server = ldap://192.168.192.2
user = ДОМЕН\ИМЯ_ПОЛЬЗОВАТЕЛЯ
password = ПАРОЛЬ_ДЛЯ_ЧТЕНИЯ_СПИСКА
base_dn = DC=ПРИМЕР,DC=ru
; Если уволенные лежат в отдельной папке, укажите её здесь. Иначе оставьте пустым.
disabled_ou =
; true — работать на примере, false — читать настоящий список сотрудников.
use_mock = false
; Сколько записей брать за один шаг из общего списка.
page_size = 1000

[Excel]
; Имя файла с паролями. Если путь полный, он используется как есть.
file = for_db.xlsx

[Web]
; Секретное слово для входа в веб-страницу. Мастер установки заменит его сам.
secret_key = ЗАМЕНИТЕ_НА_СВОЮ_ДЛИННУЮ_СТРОКУ
; 127.0.0.1 — открыть только на самом компьютере.
; 0.0.0.0 — разрешить вход с других компьютеров сети.
host = 0.0.0.0
port = 8080
; true — сервер сам перезапускается при правке файлов (для проверки).
; false — обычный режим для рабочего сервера.
reload = false

[Reports]
; Папка для отчётов. Точка означает «в той же папке, где лежит launcher.py».
dir = .
; Перед обновлениями программа сохраняет копию базы в подпапку backups.
; Нужна программа mariadb-dump или mysqldump. Другую команду можно задать
; переменной окружения DUMP_COMMAND.
