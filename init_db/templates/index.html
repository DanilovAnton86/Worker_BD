<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система поиска сотрудников</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .search-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin-bottom: 20px; }
        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .counter { color: #666; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Учётные записи сотрудников OP_DB</h2>
    
    <div class="search-box">
        <h3>Поиск сотрудника</h3>
        <form action="/search" method="get">
            <input type="text" name="query" placeholder="Введите фамилию или логин AD..." required>
            <button type="submit">Найти</button>
        </form>
        <div class="counter">Всего записей в базе данных: <strong>{{ total_count }}</strong></div>
    </div>

</body>
</html>
